# binance_bot 設定檔範本
# 複製成 config.yaml 後填入你的實際值。config.yaml 已被 .gitignore 排除。

market: crypto
symbols:
  - "BTCUSDT"
  - "ETHUSDT"

broker: paper          # 先用紙上模擬;接好 brokers/binance_broker.py 後才改 binance。可選:paper | alpaca | binance | bybit | ccxt | fubon | ibkr | kgi | okx | pionex | shioaji | tradier | tw_futures | yuanta

# 真實券商連線資訊（紙上模擬不需要）。Pionex 只填環境變數名稱；其他範本欄位
# 對應 brokers/ 內的建構子簽名。
# 請勿提交到 git。
credentials:
  api_key: ""
  api_secret: ""
  testnet: true

# 歷史 K 線來源
data:
  source: demo     # demo = 內建示範資料(離線、績效無意義);binance = 真實公開行情(不需金鑰)
  interval: 1d     # Binance K 線週期:1m 5m 15m 1h 4h 1d ...
  bars: 1000       # 抓最近幾根已收盤 K 線(越多筆交易,統計檢驗越有意義)

# 範例策略參數 —— 換成你自己的規則時可一併改掉
strategy:
  type: ma_cross          # ma_cross = 均線交叉;ai = Claude 市場觀點(會產生 API 費用)
  fast_ma: 5
  slow_ma: 20
  ai_buy_threshold: 0.5   # AI 分數 >= 這個值才進場
  ai_sell_threshold: -0.2 # AI 分數 <= 這個值就出場

# AI 訊號設定(strategy.type: ai 時才用到)
# 金鑰請自己設在環境變數 ANTHROPIC_API_KEY,絕對不要寫進這個檔案。
ai:
  model: claude-opus-5-5
  effort: low             # low / medium / high:越高越貴,不保證越準
  lookback_bars: 60       # 每次給 AI 看最近幾根 K 線
  anonymize: true         # 不告訴 AI 標的名稱與日期,降低它「認出行情」的機會
  # decide_after: "2026-07-01"  # 省略時自動用模型知識截止後的第一天;只有這天起的 K 線才讓 AI 決策
  max_calls: 200          # 單次執行最多付費呼叫次數,超過會在花錢前就停止

paper:
  starting_cash: 10000      # USDT
  fee_rate: 0.001
  slippage: 0.0005

risk:
  max_position_pct: 0.2     # 單一標的最多動用 20% 資金
  stop_loss_pct: 0.05       # 停損 5%（沒有停損是賭徒的標誌）
  take_profit_pct: 0.15     # 停利 15%

# 反詐投資王的裁決（產生時嵌入）
anti_gambling:
  verdict_level: "unknown"
  stage_code: "unverified"
  stage_reason: "尚未完成含樣本外與風險基準的交易階段分析"
  allow_live_trading: false   # 只有完整 stage 為 tiny_live_validation 才可能 true
